version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Deliberate, documented deviations (see proto/toll/admin/v1/admin.proto
    # conventions): creates/updates return the resource itself rather than
    # <Rpc>Response wrappers, and google.protobuf.Empty is shared across the
    # delete/no-payload RPCs.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - WIRE_JSON
