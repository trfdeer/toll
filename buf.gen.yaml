version: v2
clean: true
plugins:
  # Go messages + connect handlers, committed under gen/ (the Go build and
  # the Nix packages never run codegen).
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  # TypeScript for the SPA (connect-es v2): message and service code from the
  # Protobuf-ES v2 plugin, committed under web/src/gen. protoc-gen-connect-es
  # no longer exists in v2 — service descriptors come from this plugin too.
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
