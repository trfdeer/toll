version: v2
clean: true
plugins:
  # Go messages + connect handlers, committed under gen/ (the Go build and
  # the Nix packages never run codegen).
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  # TypeScript for the SPA (connect-es): message code plus the generated
  # service/client definitions. Committed under web/src/gen.
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
