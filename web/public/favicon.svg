<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">toll</title>

  <!-- Ink tile: keeps the mark legible against both light and dark browser chrome. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#161616" stroke="#ffffff" stroke-opacity="0.12" />

  <!-- Post: the stem of the lowercase "t". -->
  <rect x="13.3" y="5" width="5.4" height="22" rx="2.7" fill="#f4f4f4" />

  <!-- Barrier arm: the crossbar, longer on the right like a raised boom gate. -->
  <rect x="7.5" y="10.3" width="20" height="5.4" rx="2.7" fill="#f1c21b" />
</svg>